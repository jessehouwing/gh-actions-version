name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: cli/gh-extension-precompile@v2.2.0
        with:
          go_version_file: go.mod
          go_build_options: "-ldflags=-s -w -X=github.com/jessehouwing/gh-actions-version/internal/cmd.Version=${{ github.ref_name }}"
          generate_attestations: true
