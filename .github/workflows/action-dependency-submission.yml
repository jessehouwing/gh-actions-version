# This workflow is managed by gh actions-lock.

name: Submit Dependencies
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 0 * * 0' # Weekly

permissions:
  contents: read

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for dependency submission
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
      - name: Require actions lockfile
        run: |
          if [ ! -f .github/workflows/actions.lock ]; then
            echo "::error::Missing .github/workflows/actions.lock"
            exit 1
          fi
      - uses: jessehouwing/actions-dependency-submission@v2.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          actions-lock-version: v0.4.1
      - uses: actions/dependency-review-action@v5.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
           retry-on-snapshot-warnings: true
