name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Unformatted files:"; echo "$out"; exit 1; fi
      - name: go test
        run: go test -race ./...
