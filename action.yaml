name: 'Actions SemVer Checker'
description: 'Checks the version tags for your action repository to ensure the correct versions will be picked.'
branding:
  icon: 'check-circle'
  color: 'orange'
inputs:
  token:
    description: "GitHub token for API access. If not provided, falls back to GITHUB_TOKEN environment variable."
    required: false
    default: ""
  check-minor-version:
    description: "Configures warnings for minor versions (options: [error, warning, none, true, false], default: error)."
    required: false
    default: ""
  check-releases:
    description: "Check that for every build version a GitHub Release exists (options: [error, warning, none, true, false], default: error. true maps to error, false maps to none)."
    required: false
    default: ""
  check-release-immutability:
    description: "Check that releases are immutable and cannot be force-pushed (options: [error, warning, none, true, false], default: error. true maps to error, false maps to none)."
    required: false
    default: ""
  ignore-preview-releases:
    description: "Ignore preview/pre-release versions when calculating major/minor version tags (options: [true, false], default: true)."
    required: false
    default: ""
  floating-versions-use:
    description: "Specify whether floating versions (major/minor like v1, v1.0, and latest) should use tags or branches (options: [tags, branches], default: tags)."
    required: false
    default: ""
  auto-fix:
    description: "Automatically fix major/minor versions when a build tag is pushed. Requires contents: write permission (options: [true, false], default: false)."
    required: false
    default: "false"
  ignore-versions:
    description: "Comma-separated list of versions to ignore during validation (e.g., 'v1.0.0,v2.0.0'). Useful for skipping legacy or problematic versions."
    required: false
    default: ""
  check-marketplace:
    description: "Check that action.yaml has required marketplace metadata (name, description, branding) and README.md exists (options: [error, warning, none, true, false], default: error)."
    required: false
    default: ""
  dangerously-allow-destructive-tag-deletion:
    description: "Allow auto-fix to delete a tag whose immutable release was deleted, so it can be republished. This cannot be undone (options: [true, false], default: false)."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
  - name: "Installing the version-action extension..."
    shell: pwsh
    env:
      GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
      # The ref this action was invoked with (tag, branch or SHA) and the repository it lives in.
      ACTION_REF: ${{ github.action_ref }}
      ACTION_REPOSITORY: ${{ github.action_repository }}
    run: |
      $ErrorActionPreference = 'Stop'
      # The extension is released from this action's own repository, which must be named gh-<name>.
      $extRepo = $env:ACTION_REPOSITORY
      $repoName = ($extRepo -split '/')[-1]
      if ($repoName -notlike 'gh-*') { throw "gh extensions must live in a repository named gh-*; '$extRepo' is not" }
      $name = $repoName -replace '^gh-'

      $installed = gh extension list | Where-Object { ($_ -split "`t")[0] -eq "gh $name" }
      if ($installed) {
        Write-Host "gh $name is already installed: $installed"
        return
      }

      # Match the action's own version: a full semver tag is used as is; a floating tag (v1, v1.0), branch or SHA
      # is resolved to the highest release tag on the same commit.
      $ref = $env:ACTION_REF
      $tag = $null
      if ($ref -match '^v\d+\.\d+\.\d+$') {
        $tag = $ref
      } elseif ($ref) {
        $sha = gh api "repos/$extRepo/commits/$ref" --jq .sha 2>$null
        if ($sha) {
          $tag = gh api "repos/$extRepo/git/matching-refs/tags/v" --paginate --jq ".[] | select(.object.sha == `"$sha`") | .ref | ltrimstr(`"refs/tags/`")" |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]($_ -replace '^v') } -Descending | Select-Object -First 1
        }
      }

      if ($tag) {
        Write-Host "Installing gh $name $tag from $extRepo"
        gh extension install $extRepo --pin $tag
      } else {
        Write-Host "::warning::Could not map action ref '$ref' to a release of $extRepo; installing the latest release"
        gh extension install $extRepo
      }
      if ($LASTEXITCODE -ne 0) { throw "Failed to install the $name extension from $extRepo" }

  - name: "Checking versions..."
    shell: pwsh
    env:
      GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
      CHECK_MINOR: ${{ inputs.check-minor-version }}
      CHECK_RELEASES: ${{ inputs.check-releases }}
      CHECK_IMMUTABILITY: ${{ inputs.check-release-immutability }}
      CHECK_MARKETPLACE: ${{ inputs.check-marketplace }}
      IGNORE_PREVIEW: ${{ inputs.ignore-preview-releases }}
      FLOATING_USE: ${{ inputs.floating-versions-use }}
      AUTO_FIX: ${{ inputs.auto-fix }}
      IGNORE_VERSIONS: ${{ inputs.ignore-versions }}
      ALLOW_TAG_DELETION: ${{ inputs.dangerously-allow-destructive-tag-deletion }}
    run: |
      $ErrorActionPreference = 'Stop'
      # Only inputs that were set become flags, so action-version.yml still applies to the rest.
      $cli = @()
      foreach ($o in @(
        @('--check-minor-version', $env:CHECK_MINOR),
        @('--check-releases', $env:CHECK_RELEASES),
        @('--check-release-immutability', $env:CHECK_IMMUTABILITY),
        @('--check-marketplace', $env:CHECK_MARKETPLACE),
        @('--floating-versions-use', $env:FLOATING_USE)
      )) {
        if ($o[1]) { $cli += $o[0], $o[1] }
      }
      if ($env:IGNORE_PREVIEW -eq 'false') { $cli += '--include-preview-releases' }
      if ($env:IGNORE_VERSIONS) { $cli += '--ignore-versions', $env:IGNORE_VERSIONS }
      if ($env:ALLOW_TAG_DELETION -eq 'true') { $cli += '--dangerously-allow-destructive-tag-deletion' }
      $cli += if ($env:AUTO_FIX -eq 'true') { '--auto-fix' } else { '--check' }
      gh version-action @cli
      exit $LASTEXITCODE
