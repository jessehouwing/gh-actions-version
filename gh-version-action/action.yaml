name: 'Actions SemVer Checker'
description: 'Checks the version tags for your action repository to ensure the correct versions will be picked.'
branding:
  icon: 'check-circle'
  color: 'orange'
inputs:
  token:
    description: "GitHub token for API access. Falls back to github.token."
    required: false
    default: ""
  check-minor-version:
    description: "Minor version tag checks (error, warning, none, true, false)."
    required: false
    default: "error"
  check-releases:
    description: "Require releases for patch versions (error, warning, none, true, false)."
    required: false
    default: "error"
  check-release-immutability:
    description: "Require releases to be published (error, warning, none, true, false)."
    required: false
    default: "error"
  check-marketplace:
    description: "Validate marketplace metadata (error, warning, none, true, false)."
    required: false
    default: "error"
  ignore-preview-releases:
    description: "Exclude prereleases from floating version calculation."
    required: false
    default: "true"
  floating-versions-use:
    description: "Use tags or branches for floating versions."
    required: false
    default: "tags"
  auto-fix:
    description: "Automatically fix issues (requires contents: write)."
    required: false
    default: "false"
  ignore-versions:
    description: "Comma-separated list of versions to skip (supports wildcards like v1.*)."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install gh-version-action extension
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
      run: gh extension install jessehouwing/gh-version-action --force
    - name: Run semver check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        GH_REPO: ${{ github.repository }}
        IN_MINOR: ${{ inputs.check-minor-version }}
        IN_RELEASES: ${{ inputs.check-releases }}
        IN_IMMUTABILITY: ${{ inputs.check-release-immutability }}
        IN_MARKETPLACE: ${{ inputs.check-marketplace }}
        IN_PREVIEW: ${{ inputs.ignore-preview-releases }}
        IN_FLOATING: ${{ inputs.floating-versions-use }}
        IN_AUTOFIX: ${{ inputs.auto-fix }}
        IN_IGNORE: ${{ inputs.ignore-versions }}
      run: |
        mode="--check"
        if [ "$(echo "$IN_AUTOFIX" | tr '[:upper:]' '[:lower:]')" = "true" ]; then mode="--auto-fix"; fi
        args=("$mode" "--repo" "$GH_REPO"
          "--check-minor-version=$IN_MINOR"
          "--check-releases=$IN_RELEASES"
          "--check-release-immutability=$IN_IMMUTABILITY"
          "--check-marketplace=$IN_MARKETPLACE"
          "--ignore-preview-releases=$IN_PREVIEW"
          "--floating-versions-use=$IN_FLOATING")
        if [ -n "$IN_IGNORE" ]; then args+=("--ignore-versions=$IN_IGNORE"); fi
        gh version-action "${args[@]}"
